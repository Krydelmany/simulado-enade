<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1a2340" />
		<meta
			name="description"
			content="Simulado ENADE Engenharia de Computação — treino livre, estudo por níveis e simulado no formato real da prova, com questões oficiais do INEP"
		/>
		<meta property="og:title" content="Simulado ENADE · Engenharia de Computação" />
		<meta
			property="og:description"
			content="Treino livre, estudo por níveis e simulado real com questões oficiais do INEP."
		/>
		<meta property="og:type" content="website" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Simulado ENADE · Engenharia de Computação</title>
		<script>
			try {
				var t = localStorage.getItem('enade-tema');
				if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
